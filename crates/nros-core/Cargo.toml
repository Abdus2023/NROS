[package]
name = "nros-core"
version.workspace = true
edition.workspace = true
description = "NROS Core: Lock-free zero-copy IPC, ring buffers, pub/sub with <10us latency target"
license.workspace = true

[lib]
name = "nros_core"
path = "src/lib.rs"

[[bin]]
name = "nros-core-demo"
path = "src/main.rs"

[dependencies]
nros-types = { path = "../nros-types" }
# Optional: loom-based model checking of the SPSC synchronization protocol
# (Pass 31, P31-02). Enabled only via `--features loom` for tests/loom.rs;
# off by default so default builds, Miri and the offline pipeline are unaffected.
loom = { version = "0.7", optional = true }

[dev-dependencies]
trybuild = "1.0"
