[package]
name = "nros-types"
version.workspace = true
edition.workspace = true
description = "NROS canonical types — Twist, Odometry, Vector3, Timestamp, MonotonicTimestamp, MotorCommand, PointCloud — single source of truth per AUDIT Pass 12 INTEGRATION-001"
license.workspace = true

[lib]
name = "nros_types"
path = "src/lib.rs"

[lints.rust]
# The test suite uses `#[cfg_attr(miri, ignore)]` for the wall-clock test,
# which cannot run under Miri isolation. Declare the `miri` cfg (set by
# `cargo miri`) so check-cfg does not lint it as unexpected.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(miri)"] }

[dependencies]
