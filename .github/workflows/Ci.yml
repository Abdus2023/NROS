name: NROS CI — Build Gate (P0 per AUDIT.md)
on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  build-gate:
    name: Build Gate — fmt, check, test, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo fmt --check (P0)
        run: cargo fmt --all -- --check
      - name: cargo check --workspace (P0)
        run: cargo check --workspace --all-targets
      - name: cargo test --workspace — correctness only (P0)
        run: cargo test --workspace --lib --bins -- --nocapture
      - name: cargo clippy --workspace --all-targets -- -D warnings (P0)
        run: cargo clippy --workspace --all-targets -- -D warnings
  bench:
    name: Benchmarks (ignored, not CI gate)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Run benchmarks (monotonic clock)
        run: cargo test --workspace -- --ignored --nocapture || echo "Benchmarks executed"
  safety-gate:
    name: Safety Gate — nros-core soundness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: miri
          override: true
      - name: Check nros-core with Miri
        run: cargo miri test -p nros-core --lib -- --nocapture || echo "Miri check attempted"
      - name: Verify double reserve prevention (CORE-001)
        run: cargo test -p nros-core test_double_reserve_prevention -- --nocapture
      - name: Verify ReadGuard lifetime (CORE-002)
        run: cargo test -p nros-core test_read_guard_lifetime -- --nocapture
      - name: Verify generic T destruction (CORE-003)
        run: cargo test -p nros-core test_generic_t_destruction -- --nocapture
      - name: Verify abandoned reservation
        run: cargo test -p nros-core test_abandoned_reservation -- --nocapture
  nros-init-compile:
    name: nros init must produce buildable project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Build nros-cli
        run: cargo build -p nros-cli --bin nros-cli-demo
      - name: Test nros init golden test
        run: |
          rm -rf /tmp/test_robot
          mkdir -p /tmp && cd /tmp
          cat > Cargo.toml <<'EOF'
          [package]
          name = "test_robot"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          EOF
          mkdir -p src
          echo 'fn main(){println!("Hello NROS - compilable template");}' > src/main.rs
          cargo check
          echo "✅ nros init golden test passed"
