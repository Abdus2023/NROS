name: NROS CI

# Branch-bound CI for the audited lineage.
# The workflow tests THIS branch's tree and records the commit SHA it ran against.
# Safety semantics: fmt / check / test / clippy / miri are hard gates; benchmarks are report-only.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  provenance:
    name: Provenance / SHA manifest
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.manifest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record verification manifest
        id: manifest
        run: |
          sha="${GITHUB_SHA}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "head_sha=${GITHUB_SHA}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "runner=$(uname -a)"
            echo "rustc=$(rustc --version 2>/dev/null || echo 'toolchain-not-yet-installed')"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > verification-manifest.env
          cat verification-manifest.env
      - uses: actions/upload-artifact@v4
        with:
          name: verification-manifest
          path: verification-manifest.env

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: cargo check (workspace, all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo check --workspace --all-targets

  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --all-targets

  clippy:
    name: cargo clippy (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets

  safety-gate:
    name: Safety gate (Miri, hard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Miri
        run: |
          rustup default nightly
          rustup component add miri
          cargo miri setup
      - name: Miri on nros-core
        run: cargo miri test -p nros-core --lib
      - name: Miri on nros-types
        run: cargo miri test -p nros-types --lib

  nros-init-golden:
    name: nros init generates a buildable NROS project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CLI
        run: cargo build -p nros-cli
      - name: Run nros init (basic template) and cargo-check
        run: |
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/target/debug/nros" init test_robot_basic --template=basic
          cd test_robot_basic && cargo check
      - name: Run nros init (mobile_base template) and cargo-check
        run: |
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/target/debug/nros" init test_robot_mobile --template=mobile_base
          cd test_robot_mobile && cargo check

  benchmarks:
    name: Benchmarks (report-only, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build benchmark
        run: cargo build -p nros-core --bin bench
      - name: Run benchmark
        run: |
          mkdir -p benchmarks
          ./target/debug/bench --output benchmarks/ci-results.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/ci-results.json

  doc-gate:
    name: Claim / evidence / representation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install documentation validator dependency
        run: python3 -m pip install --disable-pip-version-check --no-input pyyaml
      - name: Run documentation representation validator
        run: python3 scripts/validate-documentation-representation.py
      - name: Run nros-audit all gates
        run: cargo run -p nros-audit -- all
      - name: Run explicit repository representation gate
        run: cargo run -p nros-audit -- representation
      - name: Run structural safety gate
        run: cargo run -p nros-audit -- safety
