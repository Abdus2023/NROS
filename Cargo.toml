[workspace]
members = [
    "crates/nros-types",
    "crates/nros-core",
    "crates/nros-node",
    "crates/nros-hal",
    "crates/nros-transport",
    "crates/nros-distributed",
    "crates/nros-cli",
    "crates/nros-sim",
    "crates/nros-studio",
    "crates/nros-macros",
    "crates/nros",
    "crates/nros-audit",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NROS Project <nros@example.com>"]
license = "MIT"
repository = "https://github.com/Abdus2023/NROS"
description = "Native Robotics Operating System - ground-up redesign for real-time, zero-copy, deterministic robotics middleware"

[workspace.dependencies]
# Add shared dependencies here as ecosystem grows
