schema_version: "0.1"
kind: documentation_authority_catalog
project: NROS

authorities:
  - id: AUTH-CONCEPTS
    name: docs/concepts/
    authority_level: canonical
    scope: conceptual model, terminology, and design principles

  - id: AUTH-ARCHITECTURE
    name: docs/architecture/
    authority_level: canonical
    scope: architectural structure, boundaries, and system relationships

  - id: AUTH-SPECIFICATIONS
    name: docs/specifications/
    authority_level: canonical
    scope: normative contracts, protocols, interfaces, and safety requirements

  - id: AUTH-REFERENCE
    name: docs/reference/
    authority_level: authoritative
    scope: concrete repository interfaces and supported reference surfaces
    notes: Reference entries must correspond to interfaces present in the source tree.

  - id: AUTH-VERIFICATION
    name: docs/verification/
    authority_level: authoritative
    scope: evidence interpretation, claims, testing, benchmarks, validation, and documentation integrity

  - id: AUTH-SAFETY
    name: docs/safety/
    authority_level: authoritative
    scope: safety invariants, gates, remediation, and threat boundaries

  - id: AUTH-DEVELOPMENT
    name: docs/development/
    authority_level: supporting
    scope: contributor workflow and development practices

  - id: AUTH-OPERATIONS
    name: docs/operations/
    authority_level: supporting
    scope: deployment, observability, diagnostics, and troubleshooting

  - id: AUTH-GOVERNANCE
    name: docs/governance/
    authority_level: supporting
    scope: roadmap, status, decisions, and releases

  - id: AUTH-MIGRATION
    name: docs/migration/
    authority_level: authoritative
    scope: migration of legacy documentation and preservation of historical traceability

  - id: AUTH-REPOSITORY-REPRESENTATION
    name: docs/REPOSITORY_REPRESENTATION.md
    authority_level: canonical
    scope: repository representation model, evidence hierarchy, claim discipline, and representation invariants

  - id: AUTH-REPRESENTATION-MANIFESTS
    name: docs/representation/*.yaml
    authority_level: canonical
    scope: machine-readable repository representation state, capabilities, evidence, claims, and snapshot identity

  - id: AUTH-DOCUMENTATION-SCHEMA
    name: docs/documentation/schema.yaml
    authority_level: canonical
    scope: documentation representation structure, vocabulary, and cross-document invariants

  - id: AUTH-EVIDENCE-REGISTRY
    name: EVIDENCE_REGISTRY.md
    authority_level: authoritative
    scope: capability evidence classification and claim eligibility

  - id: AUTH-AUDIT-HISTORY
    name: AUDIT.md and AUDIT_PASS_*.md
    authority_level: historical
    scope: repository audit findings and verification observations at their represented revisions
    notes: Historical observations do not override current source or current verification.

  - id: AUTH-CORE-SAFETY
    name: crates/nros-core/SAFETY.md
    authority_level: authoritative
    scope: nros-core safety invariants, unsafe boundaries, lifetime/destruction model, and required safety verification

  - id: AUTH-THREAT-MODEL
    name: docs/THREAT_MODEL.md
    authority_level: authoritative
    scope: safety and concurrency threat model, violation scenarios, fixes, and verification gates

  - id: AUTH-IMPLEMENTATIONS-MAP
    name: implementations/README.md
    authority_level: authoritative
    scope: authoritative-versus-archival source mapping for implementation artifacts

  - id: AUTH-CI-DEFINITION
    name: docs/ci.yml
    authority_level: authoritative
    scope: CI workflow definition and intended verification gates
    notes: Workflow definition is not execution evidence until GitHub Actions actually runs it.

  - id: AUTH-README
    name: README.md
    authority_level: informational
    scope: user-facing overview and navigation
    notes: README claims must resolve through evidence and claim policy before being treated as verified.

  - id: AUTH-COMPARISON
    name: COMPARISON.md
    authority_level: supporting
    scope: evidence-bounded comparative narrative
    notes: Comparative performance and readiness statements require independent evidence records.

rules:
  - canonical_design_defines_intent_not_execution
  - canonical_representation_defines_representation_semantics
  - evidence_registry_and_verification_constrain_claim_strength
  - source_revision_and_execution_evidence_take_precedence_over_stale_narrative
  - informational_documents_must_not_override_authoritative_documents
  - no_authority_level_implies_implementation_maturity
