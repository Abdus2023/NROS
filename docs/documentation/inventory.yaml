schema_version: "0.1"
kind: documentation_inventory
project: NROS

scope:
  mode: documentation_rewrite
  note: >-
    Inventory of active, supporting, and historical documentation artifacts.
    Legacy entry points remain discoverable for traceability but do not retain
    authority that has been migrated into focused documentation domains.

documents:
  - id: DOC-README
    path: README.md
    type: guide
    authority: informational
    status: active
    purpose: Repository overview, user-facing orientation, and navigation.

  - id: DOC-DESIGN
    path: DESIGN.md
    type: legacy-entry-point
    authority: historical
    status: migrated
    purpose: Compatibility entry point for the historical design document; current design authority lives under docs/architecture/ and docs/specifications/.

  - id: DOC-COMPARISON
    path: COMPARISON.md
    type: comparison
    authority: supporting
    status: active
    purpose: Evidence-bounded NROS versus ROS 2 architectural comparison.

  - id: DOC-AUDIT
    path: AUDIT.md
    type: audit-history
    authority: historical
    status: migrated
    purpose: Historical repository verification entry point; current verification authority lives under docs/verification/.

  - id: DOC-EVIDENCE
    path: EVIDENCE_REGISTRY.md
    type: evidence
    authority: authoritative
    status: active
    purpose: Feature-to-specification-to-implementation evidence and claim classification.

  - id: DOC-REPRESENTATION
    path: docs/REPOSITORY_REPRESENTATION.md
    type: normative
    authority: canonical
    status: active
    purpose: Normative model connecting architecture, implementation, evidence, claims, and repository state.

  - id: DOC-THREAT-MODEL
    path: docs/THREAT_MODEL.md
    type: security
    authority: authoritative
    status: active
    purpose: Safety and concurrency threat model.

  - id: DOC-CI
    path: docs/ci.yml
    type: verification
    authority: authoritative
    status: active
    purpose: Version-controlled CI workflow definition; execution must be independently observed.

  - id: DOC-CORE-SAFETY
    path: crates/nros-core/SAFETY.md
    type: safety
    authority: authoritative
    status: active
    purpose: nros-core safety and verification requirements.

  - id: DOC-IMPLEMENTATIONS
    path: implementations/README.md
    type: operational
    authority: authoritative
    status: active
    purpose: Distinction between authoritative crates and archival implementation artifacts.

  - id: DOC-DOCUMENTATION-INTEGRITY
    path: docs/verification/documentation-integrity.md
    type: verification
    authority: authoritative
    status: active
    purpose: Integrity gate for documentation roles, claims, links, revisions, and migration state.

  - id: DOC-MIGRATION
    path: docs/migration/README.md
    type: migration
    authority: authoritative
    status: active
    purpose: Legacy-document classification and migration policy.

  - id: DOC-GETTING-STARTED
    path: docs/getting-started/README.md
    type: guide
    authority: supporting
    status: active
    purpose: Practical entry point for installation and first use.

  - id: DOC-REFERENCE
    path: docs/reference/README.md
    type: reference
    authority: authoritative
    status: active
    purpose: Concrete repository interfaces and reference surfaces.

  - id: DOC-DEVELOPMENT
    path: docs/development/README.md
    type: guide
    authority: supporting
    status: active
    purpose: Developer workflow and contribution guidance.

  - id: DOC-SAFETY
    path: docs/safety/README.md
    type: safety
    authority: authoritative
    status: active
    purpose: Safety boundaries, invariants, gates, remediation, and threat analysis.

  - id: DOC-OPERATIONS
    path: docs/operations/README.md
    type: operations
    authority: supporting
    status: active
    purpose: Deployment, observability, diagnostics, and troubleshooting.

  - id: DOC-GOVERNANCE
    path: docs/governance/README.md
    type: governance
    authority: supporting
    status: active
    purpose: Roadmap, status, decisions, and release process.

  - id: DOC-AUDIT-HISTORY
    path: AUDIT_PASS_*.md
    type: audit-history
    authority: historical
    status: archived
    purpose: Historical verification passes retained with their represented revision context.

  - id: DOC-REPRESENTATION-MANIFESTS
    path: docs/representation/*.yaml
    type: machine-readable
    authority: canonical
    status: active
    purpose: Repository capability, evidence, claim, and snapshot manifests.

  - id: DOC-DOCUMENTATION-MANIFESTS
    path: docs/documentation/*.yaml
    type: machine-readable
    authority: canonical
    status: active
    purpose: Documentation inventory, authority, relationships, references, and schema.

invariants:
  - inventory_records_document_identity_and_migration_state
  - historical_documents_do_not_override_current_source_of_truth
  - README_is_not_authoritative_for_implementation_maturity
  - documentation_presence_does_not_imply_execution_success
  - legacy_entry_points_must_link_to_current_authorities
  - machine_readable_manifests_must_be_regenerated_when_their_represented_revision_changes
