schema_version: "0.1"
kind: documentation_reference_catalog
project: NROS

purpose: >-
  Explicit catalog of important documentation-to-document references.
  Resolution status is recorded without silently converting references into evidence.

references:
  - source: DOC-README
    target: DOC-ARCHITECTURE
    status: resolved
    kind: internal_document
  - source: DOC-README
    target: DOC-GETTING-STARTED
    status: resolved
    kind: internal_document
  - source: DOC-README
    target: DOC-VERIFICATION
    status: resolved
    kind: internal_document
  - source: DOC-DESIGN
    target: DOC-ARCHITECTURE
    status: resolved
    kind: internal_document
  - source: DOC-DESIGN
    target: DOC-MIGRATION
    status: resolved
    kind: internal_document
  - source: DOC-COMPARISON
    target: DOC-EVIDENCE
    status: resolved
    kind: internal_document
  - source: DOC-COMPARISON
    target: DOC-SAFETY
    status: resolved
    kind: internal_document
  - source: DOC-AUDIT
    target: DOC-DOCUMENTATION-INTEGRITY
    status: resolved
    kind: internal_document
  - source: DOC-AUDIT
    target: DOC-VERIFICATION
    status: resolved
    kind: internal_document
  - source: DOC-EVIDENCE
    target: DOC-VERIFICATION
    status: resolved
    kind: internal_document
  - source: DOC-EVIDENCE
    target: DOC-REPRESENTATION
    status: resolved
    kind: internal_document
  - source: DOC-REFERENCE
    target: DOC-IMPLEMENTATIONS
    status: resolved
    kind: internal_document
  - source: DOC-REFERENCE
    target: DOC-DEVELOPMENT
    status: resolved
    kind: internal_document
  - source: DOC-SAFETY
    target: DOC-THREAT-MODEL
    status: resolved
    kind: internal_document
  - source: DOC-SAFETY
    target: DOC-CORE-SAFETY
    status: resolved
    kind: internal_document
  - source: DOC-VERIFICATION
    target: DOC-EVIDENCE
    status: resolved
    kind: internal_document
  - source: DOC-VERIFICATION
    target: DOC-CI
    status: resolved
    kind: internal_document
  - source: DOC-MIGRATION
    target: DOC-DESIGN
    status: resolved
    kind: internal_document
  - source: DOC-MIGRATION
    target: DOC-AUDIT
    status: resolved
    kind: internal_document
  - source: DOC-MIGRATION
    target: DOC-COMPARISON
    status: resolved
    kind: internal_document
  - source: DOC-DOCUMENTATION-INTEGRITY
    target: DOC-DOCUMENTATION-MANIFESTS
    status: resolved
    kind: internal_document
  - source: DOC-DOCUMENTATION-MANIFESTS
    target: DOC-DOCUMENTATION-SCHEMA
    status: resolved
    kind: internal_document
  - source: DOC-DOCUMENTATION-MANIFESTS
    target: DOC-REPRESENTATION-MANIFESTS
    status: resolved
    kind: internal_document

reference_policy:
  resolved: Reference target is represented by a known repository document or explicit artifact.
  unresolved: Reference is known conceptually but its target cannot yet be established.
  external: Reference leaves the repository boundary and requires independent validation.
  intentionally_missing: Absence is deliberate and documented.
  unknown: Resolution has not yet been established.

invariants:
  - references_are_not_implementation_evidence
  - unresolved_references_remain_visible
  - external_references_require_independent_validation
  - reference_status_must_not_be_inferred_from_document_authority
