schema_version: "0.1"
kind: documentation_relationship_graph
project: NROS

relationships:
  - source: DOC-DESIGN
    relation: migrated_to
    target: DOC-ARCHITECTURE
    rationale: Legacy design material is now represented by focused architecture documentation.
  - source: DOC-DESIGN
    relation: migrated_to
    target: DOC-REFERENCE
    rationale: Concrete interfaces formerly mixed into design material belong in reference documentation.
  - source: DOC-DESIGN
    relation: migrated_to
    target: DOC-MIGRATION
    rationale: Legacy design material and migration policy are explicitly separated.
  - source: DOC-AUDIT
    relation: migrated_to
    target: DOC-DOCUMENTATION-INTEGRITY
    rationale: Current documentation integrity is maintained by the focused verification gate.
  - source: DOC-AUDIT
    relation: historical_for
    target: DOC-VERIFICATION
    rationale: Historical audits remain evidence about their represented revisions.
  - source: DOC-COMPARISON
    relation: constrained_by
    target: DOC-EVIDENCE
    rationale: Comparative claims are evidence-bounded.
  - source: DOC-EVIDENCE
    relation: constrains
    target: DOC-README
    rationale: Evidence classification limits public capability claims.
  - source: DOC-EVIDENCE
    relation: constrains
    target: DOC-COMPARISON
    rationale: Evidence determines permissible comparison strength.
  - source: DOC-REPRESENTATION
    relation: governs
    target: DOC-REPRESENTATION-MANIFESTS
    rationale: Repository representation defines the semantics of machine-readable manifests.
  - source: DOC-DOCUMENTATION-SCHEMA
    relation: governs
    target: DOC-DOCUMENTATION-MANIFESTS
    rationale: Documentation schema defines the machine-readable documentation model.
  - source: DOC-IMPLEMENTATIONS
    relation: implements
    target: DOC-ARCHITECTURE
    rationale: Authoritative implementation artifacts realize documented architecture where evidence establishes implementation.
  - source: DOC-CORE-SAFETY
    relation: constrains
    target: DOC-IMPLEMENTATIONS
    rationale: Core safety requirements constrain implementation behavior.
  - source: DOC-THREAT-MODEL
    relation: constrains
    target: DOC-SAFETY
    rationale: Threat analysis informs safety boundaries and gates.
  - source: DOC-CI
    relation: verifies
    target: DOC-VERIFICATION
    rationale: CI execution contributes verification evidence; workflow definition alone is not execution evidence.
  - source: DOC-MIGRATION
    relation: governs
    target: DOC-DESIGN
    rationale: Migration policy governs the treatment of legacy design material.
  - source: DOC-REFERENCE
    relation: describes
    target: DOC-IMPLEMENTATIONS
    rationale: Reference documentation describes concrete repository interfaces.
  - source: DOC-AUDIT-HISTORY
    relation: superseded_by
    target: DOC-AUDIT
    rationale: Historical audit passes remain traceable while the audit entry point records current interpretation policy.

invariants:
  - relationships_are_directional
  - every_endpoint_must_exist_in_inventory
  - historical_records_must_not_be_treated_as_current_authority
  - verifies_does_not_mean_success_without_execution_evidence
  - references_must_not_be_interpreted_as_implementation
  - supersession_preserves_historical_traceability
