schema_version: "0.1"
kind: capability_evidence_index
project: NROS

# This index links capability IDs to repository artifacts that were actually
# located during the documentation rewrite. It is an index, not a verification
# result. Presence of an artifact does not promote a claim.

rules:
  - id: INDEX-001
    rule: artifact_presence_is_not_verification
  - id: INDEX-002
    rule: historical_audit_requires_revision_and_scope_check
  - id: INDEX-003
    rule: unknown_evidence_must_remain_unknown
  - id: INDEX-004
    rule: no_ci_or_miri_pass_claim_without_observed_execution

capabilities:
  NODE-001:
    state: IMPLEMENTED
    artifacts:
      source:
        - crates/nros-node/src/lib.rs
        - crates/nros-node/src/main.rs
      tests: []
      integration: []
      audit: []
      ci: []
      miri: []
      benchmark: []
      hardware: []
    evidence_status: PARTIAL_LINK
    verification_conclusion: NOT_VERIFIED
    note: Source artifacts were located; test/CI/Miri/benchmark evidence has not yet been reconciled into this index.

