      status: present
      paths:
        - crates/nros-core/src
    tests:
      status: executed_passed_offline_mrustc_2026-08-22
      note: >-
        20 passed / 0 failed / 1 ignored incl. Pass-27 remediation regressions
        (ZST zero-size-alloc UB fix, abort_initialized drop-panic double-drop fix);
        adversarial probes re-run green (exact drop counts, 1M wraparound cap-2).
        2026-08-24 update: Miri status decoded, see miri block below — the blocker was
        a test-side wall-clock dependency, not observed unsafe-code UB, and Pass 30
        (F30-01) removed it so the suite can execute under isolation.
    ci:
      status: check_clippy_passed_2026-08-24
    miri:
      # Pass 30 (2026-08-24): EXECUTED GREEN. CI run 32718667809 (branch
      # arena/01a03356-nros, head 2d4ea5b90 = the F30-01 remediation commit),
