schema_version: "0.1"
kind: evidence_catalog
project: NROS

rules:
  - id: EVID-001
    rule: source_presence_is_not_execution_evidence
  - id: EVID-002
    rule: configured_ci_is_not_passed_ci
  - id: EVID-003
    rule: benchmark_artifact_is_not_independent_validation
  - id: EVID-004
    rule: simulated_implementation_cannot_support_real_backend_claim
  - id: EVID-005
    rule: hardware_validation_requires_actual_hardware_evidence
  - id: EVID-006
    # Pass 30 (2026-08-24): declared execution evidence (CI run id, head SHA,
    # job conclusion in any catalog entry) must resolve to an immutable
    # external execution record; narrative descriptions of a run are not
    # evidence until the run itself resolves. Declared as a schema rule now;
    # automated referential-integrity enforcement in nros-audit remains TODO.
    rule: declared_execution_evidence_must_resolve_to_immutable_execution_record

